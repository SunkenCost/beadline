[package]
name = "beadline-core"
version = "0.2.0"
description = "Fast, zero-dependency Rust core engine, live concurrency radar, and Beads-compatible JSONL store for Beadline"
authors = ["Beadline Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.89"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"

[dev-dependencies]
tempfile = "3"
